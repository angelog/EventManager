openapi: 3.0.3
info:
  title: Event Manager API
  version: 1.0.0
  description: >
    API de gerenciamento de eventos e participantes com autenticação.
    O participante autenticado cria eventos e se inscreve em eventos.
    Leitura é pública; escrita exige token (Bearer JWT).

tags:
  - name: Health
  - name: Auth
  - name: Participants
  - name: Events
  - name: Registrations

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: API no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Cadastro (signup) — cria participante e retorna token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Participante criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { description: Email já cadastrado }
        '422': { description: Validação }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login por email e senha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { description: Credenciais inválidas }

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do participante autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Participante atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '401': { description: Não autenticado }

  /participants:
    get:
      tags: [Participants]
      summary: Lista participantes
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer }, description: Opcional — sem page/limit, retorna todos }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedParticipants' }

  /participants/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    put:
      tags: [Participants]
      summary: Atualiza o próprio cadastro
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateParticipant' }
      responses:
        '200':
          description: Participante atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '401': { description: Não autenticado }
        '403': { description: Só pode alterar o próprio cadastro }
        '409': { description: Email já cadastrado }
    delete:
      tags: [Participants]
      summary: Remove o próprio cadastro
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removido }
        '401': { description: Não autenticado }
        '403': { description: Só pode remover o próprio cadastro }

  /events:
    post:
      tags: [Events]
      summary: Cadastra um evento (do participante autenticado)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvent' }
      responses:
        '201':
          description: Evento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { description: Não autenticado }
        '409': { description: Evento duplicado (nome + data) }
        '422': { description: Validação ou data não futura }
    get:
      tags: [Events]
      summary: Lista eventos (com contagem de inscritos)
      parameters:
        - { in: query, name: page, schema: { type: integer }, description: Opcional — sem page/limit, retorna todos }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string }, description: Busca por nome }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEvents' }

  /events/{eventId}:
    parameters:
      - { in: path, name: eventId, required: true, schema: { type: integer } }
    get:
      tags: [Events]
      summary: Detalhe do evento (com dono, inscritos e contagem)
      description: >-
        Autenticação opcional. Apenas o dono do evento recebe os dados de
        contato (email/telefone) do organizador e dos inscritos; os demais
        recebem somente id e nome nesses campos.
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { description: Evento não encontrado }
    put:
      tags: [Events]
      summary: Atualiza um evento (apenas o dono)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEvent' }
      responses:
        '200':
          description: Evento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { description: Não autenticado }
        '403': { description: Apenas o dono pode alterar }
        '404': { description: Evento não encontrado }
        '409': { description: Conflito de nome + data }
    delete:
      tags: [Events]
      summary: Remove um evento (apenas o dono)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removido }
        '401': { description: Não autenticado }
        '403': { description: Apenas o dono pode remover }
        '404': { description: Evento não encontrado }

  /events/{eventId}/participants:
    parameters:
      - { in: path, name: eventId, required: true, schema: { type: integer } }
    post:
      tags: [Registrations]
      summary: Inscreve o participante autenticado no evento
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Inscrição criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { description: Não autenticado }
        '404': { description: Evento não encontrado }
        '409': { description: Já inscrito }
    get:
      tags: [Registrations]
      summary: Lista os inscritos do evento
      description: >-
        Autenticação opcional. Apenas o dono do evento recebe os dados de
        contato (email/telefone) dos inscritos; visitantes e não-donos recebem
        somente id e nome.
      responses:
        '200':
          description: Participantes inscritos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventAttendee' }
        '404': { description: Evento não encontrado }

  /events/{eventId}/participants/{participantId}:
    parameters:
      - { in: path, name: eventId, required: true, schema: { type: integer } }
      - { in: path, name: participantId, required: true, schema: { type: integer } }
    delete:
      tags: [Registrations]
      summary: Cancela inscrição (o próprio inscrito ou o dono do evento)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Inscrição cancelada }
        '401': { description: Não autenticado }
        '403': { description: Sem permissão }
        '404': { description: Inscrição/evento não encontrado }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Participant:
      type: object
      description: Participante. A senha nunca é retornada.
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: João Silva }
        email: { type: string, format: email, example: joao@email.com }
        phone: { type: string, example: '41999999999' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterInput:
      type: object
      required: [name, email, phone, password]
      properties:
        name: { type: string, example: João Silva }
        email: { type: string, format: email, example: joao@email.com }
        phone: { type: string, example: '41999999999' }
        password: { type: string, minLength: 6, example: senha123 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: joao@email.com }
        password: { type: string, example: senha123 }

    UpdateParticipant:
      type: object
      description: Ao menos um campo. Não altera senha.
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    AuthResponse:
      type: object
      properties:
        participant: { $ref: '#/components/schemas/Participant' }
        token: { type: string, description: JWT }

    Event:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Evento de Tecnologia }
        description: { type: string, nullable: true }
        date: { type: string, format: date-time }
        createdById: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventListItem:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            participantsCount: { type: integer, example: 2 }

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            createdBy: { $ref: '#/components/schemas/EventAttendee' }
            participantsCount: { type: integer, example: 2 }
            participants:
              type: array
              items: { $ref: '#/components/schemas/EventAttendee' }

    EventAttendee:
      type: object
      description: >-
        Inscrito/organizador exibido no detalhe do evento. Os campos de contato
        (email, phone) só são preenchidos quando o solicitante é o dono do evento.
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: João Silva }
        email: { type: string, format: email, description: Somente para o dono do evento }
        phone: { type: string, description: Somente para o dono do evento }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateEvent:
      type: object
      required: [name, date]
      properties:
        name: { type: string, example: Evento de Tecnologia }
        description: { type: string, example: Evento sobre desenvolvimento }
        date: { type: string, format: date-time, example: '2030-08-10T19:00:00Z' }

    UpdateEvent:
      type: object
      description: Ao menos um campo deve ser informado.
      properties:
        name: { type: string }
        description: { type: string }
        date: { type: string, format: date-time }

    Registration:
      type: object
      properties:
        id: { type: integer }
        eventId: { type: integer }
        participantId: { type: integer }
        createdAt: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 5 }

    PaginatedEvents:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EventListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedParticipants:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Error:
      type: object
      properties:
        error: { type: string, example: EVENT_NOT_FOUND }
        message: { type: string, example: Evento não encontrado }
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
